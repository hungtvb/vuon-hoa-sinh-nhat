<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Galaxy Neon — Happy Birthday My Love</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="flash"></div>

  <div id="intro">
    <p class="intro-kicker">a message written in starlight</p>
    <h1 class="intro-title">VIẾT BẰNG<br>ÁNH SÁNG</h1>
    <p class="intro-sub">Một điều dành riêng cho bạn,<br>giữa dải ngân hà.</p>
    <div class="tap-ind" aria-hidden="true"><span class="tap-ring r1"></span><span class="tap-ring r2"></span><span class="tap-dot"></span></div>
  </div>

  <button id="mute" class="hidden" type="button" aria-label="Bật hoặc tắt nhạc">
    <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#ffb3d1"/><path class="wv" d="M16 9.5a4 4 0 0 1 0 5M18.2 7.2a7.2 7.2 0 0 1 0 9.6" stroke="#ffb3d1" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
  </button>

  <audio id="music" src="assets/audio/music.mp3" loop preload="auto"></audio>
  <audio id="sfx-chime" src="assets/audio/chime.mp3" preload="auto"></audio>
  <audio id="sfx-shimmer" src="assets/audio/shimmer.mp3" preload="auto"></audio>
</div>
<script src="vendor/three-r128.min.js"></script>
<script src="vendor/three-bloom-r128.js"></script>
<script src="app.js?v=1"></script>
</body>
</html>
