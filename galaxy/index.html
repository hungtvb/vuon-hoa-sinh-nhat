<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Thiên Hà Điều Ước — Chúc Mừng Sinh Nhật</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div id="stage">
  <div id="sky"></div>
  <canvas id="gl"></canvas>

  <!-- 3 wish cluster markers (follow the star clusters) -->
  <div class="wishmark" data-wish="0"><div class="glow"></div><span>Sức khỏe</span></div>
  <div class="wishmark" data-wish="1"><div class="glow"></div><span>Bình an</span></div>
  <div class="wishmark" data-wish="2"><div class="glow"></div><span>Hạnh phúc</span></div>

  <div id="toast" class="hidden"></div>

  <!-- LETTER -->
  <div id="letter" class="hidden">
    <div class="paper">
      <h3>Chúc mừng sinh nhật chị</h3>
      <div id="letterBody"></div>
      <p class="sign">— Em của chị</p>
      <button id="closeLetter">Đóng thư</button>
    </div>
  </div>

  <div id="hint">Chạm vào từng cụm sao để thắp sáng ba điều ước</div>
  <button id="mute" aria-label="Tắt/bật nhạc">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#8a5a74"/><path class="wv" d="M16 9c1.5 1.5 1.5 4.5 0 6M18.5 7c2.5 2.5 2.5 7.5 0 10" stroke="#8a5a74" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
  </button>
  <audio id="music" src="assets/audio/music.mp3" loop preload="auto"></audio>
  <audio id="sfx-chime" src="assets/audio/chime.mp3" preload="auto"></audio>
  <audio id="sfx-shimmer" src="assets/audio/shimmer.mp3" preload="auto"></audio>
</div>
<script src="vendor/three-r128.min.js"></script>
<script src="app.js?v=1"></script>
</body>
</html>
